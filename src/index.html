<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="timer-wrapper">
            <h1>Pomodoro Timer</h1>

            <div class="mode-selector">
                <div class="mode-item">
                    <button class="mode-btn active" data-mode="pomodoro">Pomodoro</button>
                    <div class="duration-input-container">
                        <input type="number" class="duration-input" id="pomodoro-duration" min="1" max="99" value="25" data-mode="pomodoro">
                        <span class="duration-label">min</span>
                    </div>
                </div>
                <div class="mode-item">
                    <button class="mode-btn" data-mode="short-break">Short Break</button>
                    <div class="duration-input-container">
                        <input type="number" class="duration-input" id="short-break-duration" min="1" max="99" value="5" data-mode="short-break">
                        <span class="duration-label">min</span>
                    </div>
                </div>
                <div class="mode-item">
                    <button class="mode-btn" data-mode="long-break">Long Break</button>
                    <div class="duration-input-container">
                        <input type="number" class="duration-input" id="long-break-duration" min="1" max="99" value="15" data-mode="long-break">
                        <span class="duration-label">min</span>
                    </div>
                </div>
            </div>
            
            <div class="timer-display">
                <div class="timer-circle">
                    <svg class="progress-ring" width="300" height="300">
                        <circle class="progress-ring-circle-bg" cx="150" cy="150" r="140"></circle>
                        <circle class="progress-ring-circle" cx="150" cy="150" r="140"></circle>
                    </svg>
                    <div class="timer-text">
                        <div class="time-display" id="time-display">25:00</div>
                        <div class="timer-status" id="timer-status">Ready to Focus</div>
                    </div>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-btn" id="start-btn">Start</button>
                <button class="control-btn" id="pause-btn" style="display: none;">Pause</button>
                <button class="control-btn" id="reset-btn">Reset</button>
            </div>

            <div class="session-info">
                <p>Session: <span id="session-count">0</span></p>
            </div>
            
            <div class="graph-section">
                <h2 class="graph-title">Weekly Focus Time</h2>
                <canvas id="focus-graph" width="400" height="200"></canvas>
                <div class="graph-stats">
                    <div class="stat-item">
                        <span class="stat-label">Today:</span>
                        <span class="stat-value" id="today-time">0 min</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">This Week:</span>
                        <span class="stat-value" id="week-time">0 min</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="feedback-bar">
            <a class="feedback-btn" href="https://forms.gle/xRXmBZhaK61xQxwg8" target="_blank" rel="noopener noreferrer">Share feedback</a>
            <button
                type="button"
                class="settings-btn"
                id="settings-btn"
                aria-label="Open settings"
                aria-haspopup="dialog"
                aria-controls="settings-modal"
            >
                <svg class="settings-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.07 7.07 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.59.24-1.13.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.5a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.24l2.39-.96c.5.39 1.04.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.59-.24 1.13-.55 1.63-.94l2.39.96c.25.1.54 0 .68-.24l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
                </svg>
            </button>
        </div>
    </div>

    <dialog class="settings-modal" id="settings-modal" aria-labelledby="settings-modal-title">
        <div class="settings-modal-panel">
            <div class="settings-modal-header">
                <h2 id="settings-modal-title">Settings</h2>
                <button type="button" class="settings-close-btn" id="settings-close-btn" aria-label="Close settings">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>

            <div class="settings-modal-body">
                <section class="settings-section" aria-labelledby="alarm-settings-heading">
                    <h3 id="alarm-settings-heading" class="notification-label">Notification alarm</h3>
                    <div class="notification-controls">
                        <select class="notification-select" id="notification-alarm">
                            <option value="original">Original Beep</option>
                            <option value="relaxing-chime">Relaxing Chime</option>
                            <option value="urgent-alert">Urgent Alert</option>
                        </select>
                        <button class="notification-test-btn" id="test-alarm-btn" type="button">Test Alarm</button>
                    </div>
                </section>

                <section class="settings-section browser-notification-panel" aria-labelledby="browser-notification-heading">
                    <h3 id="browser-notification-heading" class="notification-label">Browser notifications</h3>
                    <p class="notification-permission-status" id="notification-permission-status" aria-live="polite"></p>
                    <div class="notification-controls">
                        <button class="notification-test-btn" id="enable-notifications-btn" type="button">
                            Enable Browser Notifications
                        </button>
                        <button class="notification-test-btn" id="test-notification-btn" type="button">
                            Test Banner
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </dialog>
    
    <script type="module" src="script.js"></script>
</body>
</html>
